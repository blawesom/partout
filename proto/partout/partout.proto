// Partout stream protocol (v1).
//
// The AgentStream is a single bidirectional gRPC stream per agent. Events flow
// agent -> server, command/control envelopes flow server -> agent, on one
// authenticated connection (PRD R4, architecture §3).
//
// Envelope framing: each message carries an opaque id, a direction-scoped
// monotonic seq, a correlation id (run_id / request id), an optional TTL, and
// exactly one typed payload (oneof). ACKs reference previously received
// envelopes by id.
syntax = "proto3";

package partout.v1;

option go_package = "internal/proto";

// AgentStream is the sole data channel between one agent and the server.
service AgentStream {
  // Stream is a bidirectional message stream. The agent initiates the
  // connection, performs the Ed25519 challenge-response handshake (enforced
  // before the first envelope is accepted), then exchanges Envelopes.
  rpc Stream(stream Envelope) returns (stream Envelope);
}

// EnvelopeKind tags the oneof payload and its direction.
enum EnvelopeKind {
  ENVELOPE_KIND_UNSPECIFIED = 0;

  // Up (agent -> server)
  HEARTBEAT = 1;
  FACTS_BATCH = 2;
  EVENTS_BATCH = 3;
  COMMAND_OUTPUT = 4;
  COMMAND_RESULT = 5;
  ACK = 6;
  SESSION_DATA = 7;
  SESSION_RESULT = 8;
  FILE_OP_RESULT = 9;

  // Down (server -> agent)
  COMMAND = 10;
  POLICY_BUNDLE = 11;
  REVOKE = 12;
  CANCEL = 13;
  SESSION_OPEN = 14;
  SESSION_INPUT = 15;
  SESSION_RESIZE = 16;
  SESSION_CLOSE = 17;
  FILE_OP = 18;
  SECRET_MATERIALIZE = 19; // down: E2E-encrypted secret for a run
  PKG_OP = 20;              // down: server dispatches package operation
  PKG_RESULT = 21;         // up: agent sends package operation result
  TASK_RUN = 22;            // down: server dispatches a task run
  TASK_RUN_RESULT = 23;     // up: agent reports task run result
  JOB_ASSIGN = 24;          // down: server assigns a job to an agent
  JOB_UNASSIGN = 25;        // down: server removes a job from an agent
  JOB_RUN_RESULT = 26;      // up: agent reports job run result

  // Handshake (per stream)
  CHALLENGE = 40;   // down: server issues
  AUTH_PROOF = 41;  // up: agent replies
}

// Envelope is the single message type on the stream.
message Envelope {
  string id = 1;             // unique per envelope
  EnvelopeKind kind = 2;
  uint64 seq = 3;            // per-direction monotonic (ordering / loss)
  string corr_id = 4;        // run_id / request correlation
  int64 ttl_unix = 5;        // expiry for queued down envelopes
  oneof payload {
    // Up
    Heartbeat heartbeat = 20;
    FactsBatch facts = 21;
    EventsBatch events = 22;
    CommandOutput output = 23;
    CommandResult result = 24;
    Ack ack = 25;
    SessionData session_data = 26;
    SessionResult session_result = 27;
    FileOpResult file_op_result = 28;
    PkgResult pkg_result = 29;     // up: package operation result
    TaskRunResult task_run_result = 41; // up: task run result
    TaskRun task_run = 42;              // down: task run dispatch
    JobAssignment job_assign = 43; // down: job assignment
    JobRunResult job_run_result = 44; // up: job run result
    JobUnassignment job_unassign = 45; // down: job unassignment
    // Down
    Command command = 30;
    PolicyBundle policy_bundle = 31;
    Revoke revoke = 32;
    Cancel cancel = 33;
    SessionOpen session_open = 34;
    SessionInput session_input = 35;
    SessionResize session_resize = 36;
    SessionClose session_close = 37;
    FileOp file_op = 38;
    SecretMaterialize secret_materialize = 39; // down: E2E secret
    PkgOp pkg_op = 40;             // down: package operation
    // Handshake
    Challenge challenge = 50;
    AuthProof auth_proof = 51;
  }
}

// Ack is sent by the receiver of an envelope to confirm delivery (and, for
// down envelopes, the guardrail re-check outcome).
message Ack {
  string envelope_id = 1;    // id of the envelope being acknowledged
  AckStatus status = 2;
  string detail = 3;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_OK = 1;
  ACK_DENIED_AGENT = 2;      // guardrail re-check failed (down envelope)
}

// ---- Up: agent -> server --------------------------------------------------

message Heartbeat {
  string agent_version = 1;
  int64 uptime_s = 2;
  int64 spool_mem_bytes = 3;
  int64 spool_disk_bytes = 4;
}

message FactsBatch {
  string host_id = 1;
  bool full = 2;             // full snapshot vs. delta
  map<string, string> facts = 3;
}

message EventsBatch {
  repeated Event events = 1;
}

message Event {
  string kind = 1;           // e.g. "container.state", "endpoint.down"
  int64 ts = 2;              // epoch seconds
  map<string, string> attrs = 3;
}

message CommandOutput {
  string run_id = 1;
  uint64 chunk_seq = 2;
  OutputStream stream = 3;
  bytes data = 4;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STDOUT = 1;
  OUTPUT_STDERR = 2;
}

message CommandResult {
  string run_id = 1;
  int32 exit_code = 2;
  string state = 3;          // succeeded|failed|timed_out|cancelled|interrupted
  int64 duration_ms = 4;
}

// SessionData is one PTY output chunk from a session (PRD §5.2.2).
message SessionData {
  string session_id = 1;
  uint64 seq = 2;            // per-session monotonic
  bytes data = 3;
}

// SessionResult is the terminal state of a session.
message SessionResult {
  string session_id = 1;
  int32 exit_code = 2;
  string state = 3;          // succeeded|failed|timed_out|cancelled|interrupted|denied
  int64 duration_ms = 4;
  string error = 5;          // set when the session never ran (start/deny error)
}

// ---- Files (PRD §5.3) -----------------------------------------------------

// FileOpKind identifies one file action (arch §3.2: FileOp carries
// upload chunk / download request / edit CAS / stat / perm change).
enum FileOpKind {
  FILE_OP_KIND_UNSPECIFIED = 0;
  FILE_OP_STAT = 1;
  FILE_OP_LIST = 2;          // directory listing (file browser)
  FILE_OP_DOWNLOAD = 3;      // chunked read, offset-resumable
  FILE_OP_UPLOAD_BEGIN = 4;  // creates agent-side temp file
  FILE_OP_UPLOAD_CHUNK = 5;  // append at offset
  FILE_OP_UPLOAD_COMMIT = 6; // atomic temp -> path rename
  FILE_OP_UPLOAD_ABORT = 7;  // remove temp file
  FILE_OP_EDIT_CAS = 8;      // compare-and-swap on sha256
  FILE_OP_SET_PERM = 9;      // chmod / chown
}

// FileOp is one file request from the server. op_id correlates it with the
// FileOpResult. Write ops (upload/edit/perm) carry a signed Decision for the
// agent-side guardrail re-check (arch §5.3, A6 action taxonomy).
message FileOp {
  string op_id = 1;          // request id (also envelope corr_id)
  FileOpKind kind = 2;
  string path = 3;           // absolute target path (no symlink components)
  int64 total_size = 4;      // expected upload size; enforced cap at begin/commit
  uint64 offset = 5;         // download offset / upload chunk offset
  bytes data = 6;            // upload chunk payload / edit content
  string mode = 7;           // octal mode string for SET_PERM ("0644")
  string user = 8;           // optional new owner (SET_PERM)
  string group = 9;          // optional new group (SET_PERM)
  string expected_sha256 = 10; // EDIT_CAS: required current sha256
  // UPLOAD_CHUNK / UPLOAD_COMMIT / UPLOAD_ABORT: the temp file path returned
  // by UPLOAD_BEGIN (the server echoes it back; path stays the final target).
  string temp_path = 11;
  Decision decision = 12;    // present for upload/edit/perm (agent re-check)
}

// SecretMaterialize delivers a secret value to an agent, E2E-encrypted
// (PRD §5.7). The server seals the plaintext with an ephemeral X25519 key:
// shared = X25519(server_eph_priv, agent_x25519_pub), key = HKDF(shared,
// "partout:secret-e2e:v1:<ref>:<version>"). Only the enrolled agent can open
// it. The agent holds the value for the lifetime of the declaring run (in
// memory) and, when cache_ttl_s > 0, may persist the sealed form (never the
// plaintext) for offline use within that window.
message SecretMaterialize {
  string ref = 1;        // secret name declared by the run
  int64 version = 2;     // version being materialized (audit)
  bytes eph_pub = 3;     // server ephemeral X25519 public key (32 bytes)
  bytes sealed = 4;      // AES-256-GCM(value) under the E2E-derived key
  int64 cache_ttl_s = 5; // 0 = in-memory only; >0 = may cache sealed form
}

// PkgOpKind enumerates the package operations (PRD §5.6).
enum PkgOpKind {
  PKG_OP_UNSPECIFIED = 0;
  PKG_LIST_UPDATES = 1; // list available updates (read-only, no mutation)
  PKG_APPLY = 2;        // apply updates: always dry-run first, then apply
}

// PkgUpdate is one package's update status (list-updates / apply journal).
message PkgUpdate {
  string name = 1;
  string installed = 2;
  string available = 3;
  int64 vuln_count = 4;    // correlated CVEs against the *installed* version
  string max_severity = 5; // critical | high | medium | low | ""
  bool is_security = 6;    // distro flagged it as a security update
}

// PkgOp dispatches a package operation to the agent (PRD §5.6).
message PkgOp {
  string op_id = 1;
  PkgOpKind kind = 2;
  Decision decision = 3;   // signed decision (PKG_APPLY only; agent re-check)
  int64 seq = 4;
  repeated string packages = 5; // restrict to these names; empty = all
  bool dry_run = 6;        // apply in dry-run mode only (no mutation)
}

// PkgResult is the agent's reply to a PkgOp.
message PkgResult {
  string op_id = 1;
  PkgOpKind kind = 2;
  int32 code = 3;         // 0 = ok, >0 = error
  string error = 4;
  repeated PkgUpdate updates = 5; // LIST: available updates
  repeated PkgUpdate before = 6;  // APPLY journal: state before
  repeated PkgUpdate after = 7;   // APPLY journal: state after
  string dry_run_summary = 8;     // APPLY: truncated dry-run output
  int64 applied_count = 9;
  int64 skipped_count = 10;
  bool applied = 11;          // true if the real (non-dry-run) apply happened
}

// ---- Tasks / playbooks (M3, PRD §5.5) --------------------------------------

// TaskStep is one intent-based step in a task (not free-form shell).
// Fields are optional; the `kind` field selects which fields apply.
message TaskStep {
  string kind = 1;         // command|file|package|service|user|group|template|assert|reboot
  string name = 2;         // display name
  string when = 3;         // constrained fact expression (empty = always)
  // command
  string command = 10;
  repeated string args = 11;
  map<string, string> env = 12;
  // file / template
  string path = 20;
  string content = 21;     // for kind=file
  string template = 22;    // for kind=template
  map<string, string> vars = 23; // for kind=template
  string mode = 24;        // for kind=file
  // package / service / user / group
  string package = 30;
  string state = 31;       // present|absent|latest | started|stopped|enabled|disabled
  string service = 32;
  string user = 33;
  string group = 34;
  // assert
  string expr = 40;        // fact expression
}

// TaskRun dispatches a task to the agent (down).
message TaskRun {
  string run_id = 1;
  string task_id = 2;
  int32 task_version = 3;
  repeated TaskStep steps = 4;
  Decision decision = 5;   // signed (task.run action class)
}

// TaskStepResult is the agent's report for one step.
message TaskStepResult {
  int32 step_index = 1;
  string state = 2;        // ok | changed | failed | skipped
  string detail = 3;
  int64 started = 4;
  int64 finished = 5;
}

// TaskRunResult is the agent's final report for a task run (up).
message TaskRunResult {
  string run_id = 1;
  string state = 2;        // succeeded | failed | interrupted
  string error = 3;
  repeated TaskStepResult steps = 4;
}

// ---- M3 jobs (PRD §5.4) -----------------------------------------------------

// JobAssignment is a resolved per-host job schedule (down). The server
// resolves the job's selector to concrete agents; each agent receives its
// own schedule + task. The agent runs this on its own clock.
message JobAssignment {
  string job_id = 1;
  string name = 2;
  string cron = 3;         // cron expression (5 fields) or @daily/@weekly/@monthly
  string timezone = 4;     // IANA tz (e.g. "UTC")
  string task_id = 5;
  int32 task_version = 6;
  repeated TaskStep steps = 7;
  int32 max_run_s = 8;     // per-run deadline (0 = 30 min)
  string overlap_policy = 9;  // allow | skip | replace
  string failure_policy = 10; // no_retry | retry
  int32 retry_backoff_s = 11; // retry delay (0 = no retry)
  string selector_snapshot = 12; // selector text (recorded for audit)
  int64 version = 13;        // monotonic version (bump on job edit)
  Decision decision = 14;   // signed task.run authorization (server-signed at assign time;
                            // agent re-checks guardrail before every fire, fail-closed)
}

// JobUnassignment removes a job from an agent (down).
message JobUnassignment {
  string job_id = 1;
}

// JobRunResult is the agent's report for one scheduled job run (up).
message JobRunResult {
  string run_id = 1;
  string job_id = 2;
  string state = 3;        // succeeded | failed | timeout
  string error = 4;
  int64 scheduled_at = 5;
  int64 started_at = 6;
  int64 finished_at = 7;
  string trigger = 8;      // cron | manual | resume
  int32 retry_of = 9;      // 0 = first attempt; >0 = retry N
}

// FileOpResult is the reply to a FileOp. code 0 = ok; >0 = error code.
message FileOpResult {
  string op_id = 1;
  FileOpKind kind = 2;
  int32 code = 3;
  string error = 4;
  FileStat stat = 5;         // STAT
  repeated FileEntry entries = 6; // LIST
  bool truncated = 7;        // LIST: more entries than cap
  bytes data = 8;            // DOWNLOAD: chunk bytes
  bool done = 9;             // DOWNLOAD: no more data
  string temp_path = 10;     // UPLOAD_BEGIN: absolute temp file path
  uint64 received = 11;      // UPLOAD_CHUNK: cumulative bytes on disk
  string new_sha256 = 12;    // EDIT_CAS / UPLOAD_COMMIT: resulting sha256
}

message FileStat {
  int64 size = 1;
  string mode = 2;           // octal, e.g. "0644"
  string owner = 3;          // owner name
  string group = 4;          // group name
  int64 mtime_unix = 5;
  string sha256 = 6;         // regular files only; "" otherwise
  bool is_dir = 7;
  bool is_symlink = 8;
}

message FileEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
  int64 size = 4;
  int64 mtime_unix = 5;
  string mode = 6;
}

// ---- Down: server -> agent ------------------------------------------------

message Decision {
  string run_id = 1;
  uint64 bundle_version = 2;
  string effect = 3;         // "allow" | "deny" | "require_approval"
  repeated string matched_rules = 4;
  bytes sig = 5;             // server Ed25519 signature (agent verifies)
  string actor_role = 6;     // requester RBAC role (for agent re-eval)
}

message Command {
  string run_id = 1;
  string execution_id = 2;
  string cmd = 3;
  repeated string args = 4;
  string cwd = 5;
  string user = 6;
  int32 timeout_s = 7;
  map<string, string> env = 8;
  bool retryable = 9;
  Decision decision = 10;
}

message PolicyBundle {
  uint64 version = 1;
  string content_hash = 2;
  string rules_json = 3;     // rules only, never secrets
  bytes server_pubkey = 4;   // server Ed25519 public key (b64) — signs Decisions
  map<string, string> host_tags = 5;  // this agent's tags (for local re-eval)
  repeated string host_roles = 6;     // this agent's roles (for local re-eval)
  string agent_id = 7;                 // server-assigned agent ID (for host:<id> predicates)
}

message Revoke {
  string reason = 1;
}

// Cancel asks the agent to stop an in-flight run (kills the process and
// reports state=cancelled).
message Cancel {
  string run_id = 1;
}

// SessionOpen starts a PTY session on the agent (PRD §5.2.2). The decision is
// evaluated as an exec action (command regex applies to cmd + args).
message SessionOpen {
  string session_id = 1;
  string cmd = 2;
  repeated string args = 3;
  string user = 4;
  int32 cols = 5;
  int32 rows = 6;
  map<string, string> env = 7;
  bool record = 8;           // capture PTY output for replay (PRD §9)
  Decision decision = 9;
}

message SessionInput {
  string session_id = 1;
  bytes data = 2;
}

message SessionResize {
  string session_id = 1;
  int32 cols = 2;
  int32 rows = 3;
}

message SessionClose {
  string session_id = 1;
}

// ---- Handshake ------------------------------------------------------------

// Challenge is issued by the server at stream open (architecture §3.1).
message Challenge {
  bytes nonce = 1;    // 32 random bytes
  int64 server_ts = 2; // server epoch seconds
}

// AuthProof is the agent's reply. sig = ed25519_sign(nonce || uuid || ts_be64).
message AuthProof {
  string agent_uuid = 1;
  int64 ts = 2;            // agent epoch seconds (skew check ±300s)
  bytes sig = 3;
}