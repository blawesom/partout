name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, which would
    # silently change runner load characteristics under the test timeouts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        # -count=1: the full second pass roughly doubled load and flake
        # probability on the 2-core runner without adding regression
        # coverage — the exec pipe-drain regression it was aimed at is
        # hammer-covered by the dedicated stress job below (-count=20).
        run: go test ./... -race -count=1

  stress:
    name: Stress (exec output race)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The exec package streams command output through pump goroutines; it
      # once had a silent output-loss race. Hammer it to keep it honest.
      - name: Stress exec package
        run: go test -race -count=20 -run 'TestRun' ./internal/agent/exec/

  security:
    name: Security (vulns + licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Known vulnerabilities
        # govulncheck: Go vuln database over the actual call graph — a
        # vulnerable function that is never called does not fail the build.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Dependency licenses
        run: bash scripts/check-licenses.sh

  e2e:
    name: E2E (install + update + systemd + backup-restore)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # These drive REAL binaries against a real server: the idempotent day-1
      # install (test-root layout + a real server started from the installed
      # unit via a mock systemctl), the supervised
      # server swap (fake systemctl — the unit itself is covered by the
      # systemd job below), the one-command v1->v2 with converged re-run,
      # the REAL systemd agent self-update (live swap + crashloop rollback),
      # and the backup-restore disaster drill.
      - name: update-server.sh scenarios
        run: bash scripts/update-server-test.sh

      - name: install-server.sh scenarios
        run: bash scripts/install-server-test.sh

      - name: one-command update E2E
        run: bash scripts/update-e2e.sh

      - name: real-systemd agent self-update E2E
        run: bash scripts/systemd-e2e.sh

      - name: backup-restore disaster drill
        run: bash scripts/backup-restore-e2e.sh

  # The REAL-install leg (RHEL-family): scripts/rocky-e2e.sh runs
  # install-server.sh as root on a real Rocky 10 (real useradd/visudo/dnf,
  # no test root), then provisions an agent over real ssh with --elevate
  # and asserts the whole D1 chain. This is the leg that would have caught
  # the v0.9.11 bootstrap bugs (policy sha mismatch, elevation.d 0700
  # under the install umask, the unprivileged dnf dry-run, the RHEL useradd
  # abort) — none of which the test-root or fake-ssh rigs can see.
  rocky:
    name: Rocky (real install + provision + elevation)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The leg runs in a Rocky 10 container (quay.io — Docker Hub's
      # official image stops at 9). The binary is built on the runner
      # (static, CGO off — the Go module cache applies) and mounted in;
      # the workspace mounts at /repo (the script resolves its repo from
      # its own path).
      - name: Build (static)
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/partout" ./cmd/partout
      - name: Real install + provision + elevation (Rocky 10)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$RUNNER_TEMP:/build" \
            quay.io/rockylinux/rockylinux:10 \
            bash -c 'PARTOUT_BIN=/build/partout bash /repo/scripts/rocky-e2e.sh'

  # Opt-in real-sshd tests. These exist because the fake-binary unit tests
  # implement ssh's *intended* semantics and therefore cannot catch the fact
  # that OpenSSH resolves ~/.ssh from the passwd database, not $HOME — which
  # made PARTOUT_SSH_DIR silently non-functional. Runs on demand, not on every
  # push, since it depends on a live sshd.
  live-ssh:
    name: Live sshd (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start sshd and authorise a test key
        run: |
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t || true
          sudo systemctl start ssh 2>/dev/null || sudo /usr/sbin/sshd
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519_ci
          cat ~/.ssh/id_ed25519_ci.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: Live SSH tests
        env:
          PARTOUT_LIVE_SSH: "1"
          PARTOUT_LIVE_SSH_HOST: "127.0.0.1"
        run: go test -tags live -run TestLive -v ./internal/sshutil/