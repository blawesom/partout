name: release

# Tag-driven GitHub release (v0.7.x pattern): `git tag v0.7.3 && git push
# origin v0.7.3` builds the version-STAMPED static binaries (amd64 + arm64)
# + SHA-256SUMS and publishes the GitHub release. scripts/release-github.sh
# verifies the stamp is actually in the binary and refuses to publish
# otherwise, so a release can never ship with a missing/blank version.
#
# Distinct from the SIGNED update repository (scripts/release-publish.sh):
# a GitHub Release is the downloadable artifact for manual installs; the
# fleet self-update path signs separately.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Pinned for the same reason as ci.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 — the changelog walks git log back to the previous tag.
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Publish stamped GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-github.sh "${GITHUB_REF_NAME}"
