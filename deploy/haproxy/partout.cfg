# Partout behind an existing HAProxy TLS edge — working pattern validated on
# ccc.laplane.net (v0.7.2 deploy, 2026-09-29). This is a SNIPPET: merge into
# your existing haproxy.cfg; the rest of the file (global, defaults, other
# frontends) is yours.
#
# Gotchas this encodes (each cost time on the reference deploy):
#
# 1. MULTI-SNI on one :443 bind: list every domain's bundle in the crt-map;
#    the second entry is the partout domain. All vhosts share the one bind
#    line, so a cert renewal touches them all (see renewal notes below).
#
# 2. `timeout client` is a FRONTEND/listen directive. HAProxy silently
#    ignores it on a `backend` (with a warning in the log). It must be on
#    the frontend for long-lived SSE + PTY streams: the defaults (1m client,
#    5m tunnel) drop idle sessions. Use 1h to match the nginx pattern in
#    docs/deployment.md.
#
# 3. Cert bundle for the `crt` entry = fullchain.pem + privkey.pem
#    concatenated, readable by the haproxy user (chown haproxy:haproxy,
#    0640). certbot renewals: keep one idempotent post-renewal rebundle
#    script that rebuilds every bundle haproxy references (rather than one
#    hand-maintained hook per domain), and prefer DNS-01 or http-01 via the
#    acme ACL below — certbot's standalone mode stops the whole proxy for
#    ~15 s on every renewal.
#
# 4. /healthz on the backend: cheap liveness that also proves the
#    backend's DB is open (503 body otherwise).

frontend main
    bind *:443
    # existing vhosts...
    crt /etc/letsencrypt/live/existing.example.com/fullchain.pem /etc/letsencrypt/live/existing.example.com/privkey.pem
    crt /etc/letsencrypt/live/ccc.laplane.net/fullchain.pem /etc/letsencrypt/live/ccc.laplane.net/privkey.pem

    # Zero-downtime http-01 renewal: serve the challenge straight from
    # disk, never touching the backends. (Requires a certbot webroot.)
    path_beg /.well-known/acme-challenge/
    http-request return 301 strict location https://%[hdr(host)]%[path] if { -i [hdr(host)] ccc.laplane.net }
    # ...or: internal + static file, per your edge's existing pattern.

    # Long-lived streams (SSE / PTY): must be on the FRONTEND, not a backend.
    timeout client 1h
    timeout connect 5s
    timeout tunnel 1h

    # route the partout domain to the local control plane
    use_backend partout if { hdr(host) -i ccc.laplane.net }

backend partout
    # healthcheck hits /healthz (200 = up + DB readable; 503 = degraded)
    option httpchk GET /healthz
    http-check expect status 200
    server partout 127.0.0.1:8443 check inter 10s rise 2 fall 3
    # SSE: no buffering, keep the connection open
    option http-server-close
    http-response set-header X-Accel-Buffering no

# --- renewal (certbot) -----------------------------------------------
# /etc/letsencrypt/renewal-hooks/post/partout-rebundle.sh — ONE idempotent
# script that: (1) rebuilds every bundle haproxy references from
# fullchain.pem + privkey.pem, (2) chown/chmod, (3) `haproxy -c -f ...` to
# validate, (4) only then `systemctl reload haproxy` (zero-downtime reload,
# not restart). Standalone issuance is the ~15s all-vhost downtime path.
